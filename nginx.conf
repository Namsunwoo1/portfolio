server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The exported archive stores chunks in the root; serve Next.js paths too.
    location ~ ^/_next/static/chunks/(?<chunk>[^/]+\.(?:js|css))$ {
        alias /usr/share/nginx/html/$chunk;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* \.(mp4|webm|webp|png|jpg|jpeg|gif|svg|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location ~* \.(html|txt|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
