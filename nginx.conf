server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 일반 라우팅 처리
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Next.js 내부 데이터 파일 서빙 허용
    location ~* \.(txt|json|html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 대용량 미디어 및 자바스크립트 청크 파일 서빙
    location ~* \.(mp4|webm|webp|png|jpg|jpeg|gif|ico|svg|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}