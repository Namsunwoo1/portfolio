server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Next.js 특수 데이터 파일 (__next.*.txt, .json) 서빙 허용
    location ~* ^/(__next|\_next) {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(txt|json)$ {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 2. 물결표(~) 및 특수기호가 포함된 자바스크립트, CSS, 미디어 파일 서빙
    location ~* \.(js|css|mp4|webm|webp|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 3. 기본 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
