server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 비디오 및 이미지 파일 장기 캐싱 및 스트리밍 지원
    location ~* \.(mp4|webm|webp|png|jpg|jpeg|gif|svg|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 기본 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }
}
