server {
    listen 80;
    server_name localhost;

    # 파일들이 위치한 경로
    root /usr/share/nginx/html;
    index index.html;

    # 웹페이지 라우팅 및 새로고침 대응
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 동영상(mp4) 및 이미지, 정적 파일 캐시 및 서빙
    location ~* \.(mp4|webm|webp|png|jpg|jpeg|gif|ico|svg|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 404 에러 시 404.html 서빙
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}