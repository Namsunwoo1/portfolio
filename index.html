<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PORTFOLIO</title>
  <!-- 원래 포트폴리오의 진짜 CSS 연결 -->
  <link rel="stylesheet" href="/0s1bma7s61jwi.css" />
  <style>
    /* 배경 및 기본 정돈 */
    body {
      background-color: #0b0c0e;
      color: #fff;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    /* 모달 기본 스타일 보완 */
    dialog.project-dialog {
      margin: auto;
      border: 1px solid #333;
      background: #16181d;
      border-radius: 16px;
      max-width: 800px;
      width: 90vw;
      color: #fff;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.85);
    }
    dialog::backdrop {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <!-- 상단 헤더 -->
  <header class="site-header" style="padding: 40px 20px 20px; text-align: center;">
    <h1 style="font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px;">PORTFOLIO</h1>
    <p style="color: #888; font-size: 1rem;">Motion Graphics & Visual Design</p>
  </header>

  <main id="top" style="max-width: 1200px; margin: 0 auto; padding: 20px;">
    <section class="projects-section wrap" id="projects">
      <div class="project-grid">

        <!-- 카드 1: 신한카드 -->
        <article class="project-card">
          <button class="project-button" type="button"
                  data-title="신한카드 x 먼작귀"
                  data-meta="01 / Promotion 2026"
                  data-video="/hero.mp4"
                  data-poster="/shinhan-v4-frame-01.png"
                  data-desc="신한카드와 먼작귀의 콜라보레이션 프로모션 영상입니다. 캐릭터의 리듬감 있는 모션과 핵심 혜택을 시각적으로 강조했습니다.">
            <div class="project-image">
              <img src="/shinhan-v4-frame-01.png" alt="신한카드 먼작귀" loading="lazy" />
              <span class="card-open" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                  <path d="M7 17L17 7M17 7H7M17 7V17"/>
                </svg>
              </span>
            </div>
            <div class="card-meta mono">01 / Promotion</div>
            <div class="card-title">신한카드 x 먼작귀</div>
            <p class="card-description">귀여움과 카드 혜택을 끊김 없는 15초 흐름으로 전달하다.</p>
            <div class="tool-tags">
              <span class="tag">After Effects</span>
              <span class="tag">Illustrator</span>
            </div>
          </button>
        </article>

        <!-- 카드 2: NEXUS STUDIO -->
        <article class="project-card">
          <button class="project-button" type="button"
                  data-title="NEXUS STUDIO"
                  data-meta="02 / Brand Identity 2026"
                  data-video="/escape.mp4"
                  data-poster="/nexus-grid.webp"
                  data-desc="타이포그래피에 입체적인 공간감과 모션감을 부여한 브랜드 디자인 필름 프로젝트입니다.">
            <div class="project-image">
              <img src="/nexus-grid.webp" alt="NEXUS STUDIO" loading="lazy" />
              <span class="card-open" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                  <path d="M7 17L17 7M17 7H7M17 7V17"/>
                </svg>
              </span>
            </div>
            <div class="card-meta mono">02 / Identity</div>
            <div class="card-title">NEXUS STUDIO</div>
            <p class="card-description">타이포그래피에 리듬과 공간을 더하다.</p>
            <div class="tool-tags">
              <span class="tag">3D Motion</span>
              <span class="tag">Typography</span>
            </div>
          </button>
        </article>

        <!-- 카드 3: ESCAPE -->
        <article class="project-card">
          <button class="project-button" type="button"
                  data-title="ESCAPE"
                  data-meta="03 / Cinematic Trailer"
                  data-video="/escape.mp4"
                  data-poster="/escape-poster.webp"
                  data-desc="스피드감과 긴장감을 극대화한 시네마틱 트레일러 모션그래픽 영상입니다.">
            <div class="project-image">
              <img src="/escape-poster.webp" alt="ESCAPE" loading="lazy" />
              <span class="card-open" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                  <path d="M7 17L17 7M17 7H7M17 7V17"/>
                </svg>
              </span>
            </div>
            <div class="card-meta mono">03 / Cinematic</div>
            <div class="card-title">ESCAPE</div>
            <p class="card-description">몰입감 있는 속도감과 공간 구성의 시네마틱 시퀀스</p>
            <div class="tool-tags">
              <span class="tag">Cinema 4D</span>
              <span class="tag">After Effects</span>
            </div>
          </button>
        </article>

      </div>
    </section>
  </main>

  <!-- 상세 팝업 다이얼로그 -->
  <dialog class="project-dialog" id="modalDialog">
    <div style="padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #262930;">
      <h2 id="mTitle" style="margin: 0; font-size: 1.3rem; font-weight: 700;"></h2>
      <button id="mCloseBtn" style="background: #2a2e38; border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px;">✕</button>
    </div>
    <div style="background: #000; width: 100%; max-height: 440px; display: flex; justify-content: center; align-items: center;">
      <video id="mVideo" controls playsinline style="width: 100%; max-height: 440px; display: block; outline: none;"></video>
    </div>
    <div style="padding: 24px;">
      <div id="mMeta" style="font-size: 0.85rem; color: #4ade80; margin-bottom: 8px; font-weight: 600;"></div>
      <p id="mDesc" style="font-size: 0.95rem; color: #d1d5db; line-height: 1.6; margin: 0;"></p>
    </div>
  </dialog>

  <!-- 안정적인 순수 자바스크립트 -->
  <script>
    const dialog = document.getElementById("modalDialog");
    const mTitle = document.getElementById("mTitle");
    const mMeta = document.getElementById("mMeta");
    const mDesc = document.getElementById("mDesc");
    const mVideo = document.getElementById("mVideo");
    const mCloseBtn = document.getElementById("mCloseBtn");

    document.querySelectorAll(".project-button").forEach((btn) => {
      btn.addEventListener("click", () => {
        mTitle.textContent = btn.getAttribute("data-title");
        mMeta.textContent = btn.getAttribute("data-meta");
        mDesc.textContent = btn.getAttribute("data-desc");

        mVideo.src = btn.getAttribute("data-video");
        mVideo.poster = btn.getAttribute("data-poster") || "";

        dialog.showModal();
        mVideo.play().catch(() => {});
      });
    });

    function closeDialog() {
      mVideo.pause();
      mVideo.currentTime = 0;
      mVideo.src = "";
      dialog.close();
    }

    mCloseBtn.addEventListener("click", closeDialog);

    dialog.addEventListener("click", (e) => {
      if (e.target === dialog) closeDialog();
    });

    dialog.addEventListener("cancel", (e) => {
      e.preventDefault();
      closeDialog();
    });
  </script>
</body>
</html>
